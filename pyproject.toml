[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp-tox-pipeline"
version = "0.1.0"
description = "Reproducible computational toxicology pipeline (NAMs-oriented)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "snakemake>=8",
    "rdkit>=2024.3",
]

[tool.setuptools.packages.find]
where = ["src"]
